[package]
name = "forge-cli"
version = "0.1.0"
edition = "2024"
description = "Operator CLI and TUI for the Forge autonomous coding harness"
license = "Apache-2.0"

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
forge-api = { path = "../crates/forge-api" }
forge-pi = { path = "../crates/forge-pi" }
futures-util.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.23"
