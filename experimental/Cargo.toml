[workspace]
members = ["forge-cli", "crates/forge-api", "crates/forge-pi"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.12"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
eventsource-stream = "0.2"
futures-util = "0.3"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tui-textarea = { version = "0.7", default-features = false, features = ["no-backend"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
