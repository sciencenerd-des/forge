name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        # The regression suite is self-contained (no DB/network); engine-import
        # tests skip cleanly if optional heavy deps are unavailable.
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, lint, and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  rust-pi-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@0.80.2
      - run: pi --version
      - run: PI_OFFLINE=1 PI_SKIP_VERSION_CHECK=1 cargo test -p forge-pi -- --ignored
